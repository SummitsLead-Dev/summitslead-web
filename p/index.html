<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>山座AR の地点</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f6f6f4;color:#222}
  main{max-width:480px;margin:0 auto;padding:32px 20px}
  h1{font-size:20px;margin:0 0 16px}
  .pt{font-size:22px;font-weight:700;letter-spacing:.02em;margin:8px 0 24px}
  a.btn{display:block;text-align:center;padding:14px;border-radius:12px;margin:12px 0;text-decoration:none;font-weight:700}
  .map{background:#1a73e8;color:#fff}
  .app{background:#fff;color:#222;border:1px solid #ccc}
  .note{font-size:13px;color:#666;margin-top:24px}
  @media (prefers-color-scheme:dark){body{background:#17181b;color:#e8e8e8}.app{background:#222;color:#e8e8e8;border-color:#444}.note{color:#9a9a9a}}
</style>
</head>
<body>
<main>
  <h1>山座AR の地点のリンクです</h1>
  <div class="pt" id="pt">地点を読めませんでした</div>
  <a class="btn map" id="gmap" href="https://www.google.com/maps" hidden>Google マップで開く</a>
  <a class="btn app" href="https://play.google.com/store/apps/details?id=jp.summitslead.sanza">山座AR を入手する（Google Play）</a>
  <p class="note">山座AR が入っている端末では、このリンクを押すと山座AR で開きます。</p>
</main>
<script>
  (function () {
    var ll = new URLSearchParams(location.search).get("ll") || "";
    var m = ll.match(/^(-?\d{1,2}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)$/);
    if (!m) return;
    var lat = parseFloat(m[1]), lon = parseFloat(m[2]);
    if (!(lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180)) return;
    var t = lat.toFixed(5) + ", " + lon.toFixed(5);
    document.getElementById("pt").textContent = "北緯・東経 " + t;
    var a = document.getElementById("gmap");
    a.href = "https://www.google.com/maps/search/?api=1&query=" + lat.toFixed(5) + "," + lon.toFixed(5);
    a.hidden = false;
  })();
</script>
</body>
</html>
